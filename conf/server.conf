server {
    listen 127.0.0.1:8081;
    client_max_body_size 2G;
    error_page 404 /errors/404.html;

    location /cgi-bin/ {
        root ./www/cgi-bin;
        cgi_enable on;
        cgi_extension py;
        cgi_path /usr/bin/python3;
        methods GET POST;
    }

    location /uploads {
        return 301 http://127.0.0.1:8081/uploads/;
        methods GET;
    }

    location /uploads/ {
        root ./www/uploads;
        index index.html;
        autoindex on;
        methods GET POST DELETE;
        upload_enable on;
        upload_store  ./www/uploads;
    }

    location / {
        root ./www;
        index index.html;
        methods GET;
    }
}

