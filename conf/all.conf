server {
    listen 127.0.0.1:8080;
    server_name baseline;
    client_max_body_size 5M;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 501 /errors/501.html;
    error_page 505 /errors/505.html;

    location / {
        root ./www;
        index index.html;
        autoindex off;
        methods GET;
    }

    location /static {
        root ./www/static;
        index index.html;
        autoindex off;
        methods GET;
    }
    location /static/ {
        root ./www/static;
        index index.html;
        autoindex off;
        methods GET;
    }

    location /static/img {
        root ./www/static/img;
        autoindex on;
        methods GET;
    }
    location /static/img/ {
        root ./www/static/img;
        autoindex on;
        methods GET;
    }

    location /noindex {
        root ./www/noindex;
        autoindex off;
        methods GET;
    }
    location /noindex/ {
        root ./www/noindex;
        autoindex off;
        methods GET;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name upload;
    client_max_body_size 25M;

    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;

    location / {
        root ./www;
        index index.html;
        methods GET;
    }

    location /upload {
        root ./www;
        upload_enable on;
        upload_store ./www/uploads;
        methods GET POST;
        autoindex off;
    }
    location /upload/ {
        root ./www;
        upload_enable on;
        upload_store ./www/uploads;
        methods GET POST;
        autoindex off;
    }

    location /uploads {
        root ./www/uploads;
        autoindex on;
        methods GET;
    }
    location /uploads/ {
        root ./www/uploads;
        autoindex on;
        methods GET;
    }

    location /delete {
        root ./www;
        upload_enable on;
        upload_store ./www/uploads;
        methods DELETE GET;
        autoindex off;
    }
    location /delete/ {
        root ./www;
        upload_enable on;
        upload_store ./www/uploads;
        methods DELETE GET;
        autoindex off;
    }
}

server {
    listen 127.0.0.1:8082;
    server_name redirector;

    error_page 404 /errors/404.html;

    location / {
        root ./www;
        index index.html;
        methods GET;
    }

    location /old {
        root ./www;
        return 301 http://127.0.0.1:8082/new;
        methods GET;
    }
    location /old/ {
        root ./www;
        return 301 http://127.0.0.1:8082/new;
        methods GET;
    }

    location /temp {
        root ./www;
        return 302 http://127.0.0.1:8082/new;
        methods GET;
    }
    location /temp/ {
        root ./www;
        return 302 http://127.0.0.1:8082/new;
        methods GET;
    }

    location /new {
        root ./www/redirect_site;
        index index.html;
        methods GET;
    }
	location /new/ {
        root ./www/redirect_site;
        index index.html;
        methods GET;
    }
}

server {
    listen 127.0.0.1:8083;
    server_name methods;
    client_max_body_size 2M;

    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;

    location /get-only {
        root ./www/get_only;
        index index.html;
        autoindex off;
        methods GET;
    }
    location /get-only/ {
        root ./www/get_only;
        index index.html;
        autoindex off;
        methods GET;
    }

    location /form {
        root ./www/form_site;
        index index.html;
        upload_enable on;
        upload_store ./www/form_uploads;
        methods GET POST;
        autoindex off;
    }
    location /form/ {
        root ./www/form_site;
        index index.html;
        upload_enable on;
        upload_store ./www/form_uploads;
        methods GET POST;
        autoindex off;
    }

    location /trash {
        root ./www/trash;
        upload_store ./www/trash;
        methods DELETE GET;
        autoindex off;
    }
    location /trash/ {
        root ./www/trash;
        upload_store ./www/trash;
        methods DELETE GET;
        autoindex off;
    }
}

