server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # root /www;
    # index index.html;

    error_page 404 /errors/404.html;
    error_page 500 /errors/50x.html;

    client_max_body_size 2M;

    location / {
        methods GET POST;
        autoindex off;
        index index.html;
    }

    location /upload {
        methods POST;
        upload_store /tmp/uploads;
    }

    location /kapouet/ {
        root /tmp/www;
        autoindex on;
        index default.html;
    }

    location /redirect-me {
        return 301 http://localhost:8080/;
    }

    location /cgi-bin/ {
        methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        root /var/www/cgi-bin;
    }
}

